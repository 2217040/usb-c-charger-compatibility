name: Update data from the site
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest CSV files
        run: |
          set -e
          curl -fsSL -A "data-sync (+https://github.com/2217040/usb-c-charger-compatibility)" "https://canitcharge.com/data/charger-compatibility.csv" -o data/charger-compatibility.csv.new
          if [ "$(wc -l < data/charger-compatibility.csv.new)" -gt 5 ]; then mv data/charger-compatibility.csv.new data/charger-compatibility.csv; else echo "Too short, keeping the old file"; rm data/charger-compatibility.csv.new; fi
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update data from the site ($(date -u +%Y-%m-%d))" && git push; fi
